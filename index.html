<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:20px;background:#191a23;border-bottom:1px solid #333;font-size:24px;font-weight:bold}
header span{color:#8b7cff}
#chat{height:calc(100dvh - 155px);overflow-y:auto;padding:16px}
.msg{padding:13px 15px;margin:12px 0;border-radius:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#34334d;margin-left:35px}
.ai{background:#20212a;margin-right:20px}
#bottom{position:fixed;bottom:0;left:0;right:0;background:#191a23;padding:12px;display:flex;gap:8px}
input{flex:1;min-width:0;background:#292a35;color:white;border:1px solid #494956;border-radius:24px;padding:14px;font-size:16px;outline:none}
button{background:#7867ff;color:white;border:0;border-radius:22px;padding:0 18px;font-size:16px}
#hint{color:#aaa;font-size:13px;text-align:center;padding:8px}
</style>
</head>
<body>
<header>✦ <span>My AI</span></header>
<div id="chat">
<div class="msg ai">হ্যালো! 👋 আমি My AI। আমাকে যেকোনো প্রশ্ন করতে পারো।</div>
<div id="hint">তোমার AI চ্যাট এখানে হবে</div>
</div>
<div id="bottom">
<input id="q" placeholder="এখানে প্রশ্ন লেখো..." autocomplete="off">
<button id="send">➤</button>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('q');
function add(text,cls){
 const d=document.createElement('div');
 d.className='msg '+cls;
 d.textContent=text;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}
function send(){
 const q=input.value.trim();
 if(!q)return;
 add(q,'user');
 input.value='';
 add('তোমার প্রশ্নটি পেয়েছি! আসল AI উত্তর পেতে এখন একটি AI API সংযুক্ত করতে হবে।','ai');
}
document.getElementById('send').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
